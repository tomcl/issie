name: Tests

on:
  push:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Expecto suite. This is the job the workflow is named after; until it existed, "Tests" ran
  # a Fable compile and nothing else, under continue-on-error, so the tick meant almost nothing.
  #
  # It blocks: no continue-on-error here. A failing test should stop a PR.
  #
  # GitHub Actions sets CI=true, and Main.fs reads that to skip the Issie.VerilogCompiler group,
  # which spawns node per parse and is over a third of the suite's runtime. So this runs 385 of
  # the 396 tests in well under a minute. Anything under src/Renderer/VerilogComponent/ still
  # needs `dotnet run --project Tests/Issie.Tests -c Release -- --filter Issie.VerilogCompiler`
  # locally - see Tests/README.md.
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v5
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Restore .NET tools and packages
      run: |
        dotnet tool restore
        dotnet paket restore
    - name: Run the Expecto suite
      run: dotnet run --project Tests/Issie.Tests -c Release

  report-prep:
    runs-on: ubuntu-latest
    steps:
    - name: Write report template
      run: |
        printf "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n" > report.xml
    - name: Upload report
      uses: actions/upload-artifact@v7
      with:
        name: report
        path: report.xml
        overwrite: true

  # Not a test run despite the name: this is the Fable compile check on Windows, reported as a
  # single JUnit case so that it shows up beside the suite above. It stays continue-on-error, so
  # it informs rather than blocks; test-suite is what blocks.
  test-integration-windows:
    runs-on: windows-latest
    needs: report-prep
    steps:
    - name: Set up .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Checkout the repo
      uses: actions/checkout@v5
    - name: Download report
      uses: actions/download-artifact@v8
      with:
        name: report
    - name: Restore .NET tools and node packages, attempt build, and report
      run: |
          $Start = Get-Date
          $TestOut = & .\build.ps1 -t Build 3>&1 2>&1
          $TestExitCode = $lastExitCode
          $End = Get-Date
          $TestTime = New-Timespan -Start $Start -End $End | Select-Object -ExpandProperty TotalSeconds
          Write-Output "<testsuites time=""$TestTime"">" >> report.xml
          Write-Output "`t<testsuite name=""Tests.Integration"" time=""$TestTime"">" >> report.xml
          Write-Output "`t`t<testcase name=""testWindows"" classname=""Tests.Integration"" time=""$TestTime"" />" >> report.xml
          if ($TestExitCode -ne 0) {
              Write-Output "`t`t`t<failure message=""Failed to build on Windows"">" >> report.xml
              Write-Output $TestOut >> report.xml
              Write-Output "`t`t`t</failure>" >> report.xml
          }
          Write-Output "`t</testsuite>" >> report.xml
          Write-Output "</testsuites>" >> report.xml
      continue-on-error: true
    - name: Upload report
      uses: actions/upload-artifact@v7
      with:
        name: report
        path: report.xml
        overwrite: true

  report-wrap-up:
    runs-on: ubuntu-latest
    needs: test-integration-windows
    steps:
    - name: Checkout the repo
      uses: actions/checkout@v5
    - name: Download report
      uses: actions/download-artifact@v8
      with:
        name: report
    - name: Upload test results
      uses: dorny/test-reporter@v3
      with:
        name: Results (${{ github.sha }})
        path: report.xml
        reporter: java-junit
        use-actions-summary: 'true'
        fail-on-error: 'false'
        fail-on-empty: 'false'
