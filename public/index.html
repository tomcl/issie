<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <!--
      The renderer runs with nodeIntegration enabled, so executing attacker-controlled
      script here means full filesystem access. This policy stops script from ever being
      loaded off a remote origin, which is the only way such script could arrive:
        'unsafe-eval'   - required by webpack's eval-based source maps in dev mode
                          (devtool: 'eval-cheap-module-source-map')
        'unsafe-inline' - required by the webpack runtime's injected bootstrap
        blob:/file:     - required by the simulation web workers (WorkerInterface.fs)
                          and by the packaged app, which loads over file://
      Tighten by removing 'unsafe-eval' once dev mode no longer uses eval source maps.
      Styles, fonts, images and connections are deliberately left unrestricted: they
      cannot execute, and constraining them risks breaking rendering.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: file: http://localhost:8672;
                   object-src 'none';
                   frame-src 'none';
                   base-uri 'none';" />
    </head>
<body>
    <div id="app"; style="overflow-y:clip"></div>
</body>
</html>
